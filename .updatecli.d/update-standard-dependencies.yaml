# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Standard Dependencies
pipelineid: update-standard-dependencies
autodiscovery:
  crawlers:
    dockerfile: {}
    npm:
      ignoreversionconstraints: true
      age:
        minimum: 1d
      ignore:
        - path: node_modules/*
        - path: dist/*
      versionfilter:
        kind: semver
        pattern: "*"
      only:
        - path: docs/package.json
        - path: package.json
labels:
  group: standard
