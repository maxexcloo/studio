name: Container

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.7
      - name: Install Dependencies
        run: mise run setup
      - name: Run Checks
        run: mise run check
      - name: Validate Release Version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(process.env.RELEASE_TAG, `v${version}`, "Tag must match package.json");
          NODE

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: metadata
        name: Extract Metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build Image for Verification
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          load: true
          platforms: linux/amd64
          tags: heiss-ui:test
      - name: Smoke-Test Runtime
        run: |
          docker run --cap-drop=ALL --detach --init --name heiss-smoke \
            --publish 127.0.0.1:8787:8787 --read-only --rm \
            --security-opt=no-new-privileges \
            --tmpfs /data:uid=1000,gid=1000,mode=0700 --tmpfs /tmp heiss-ui:test
          trap 'docker logs heiss-smoke; docker rm --force heiss-smoke' EXIT
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' heiss-smoke)" = healthy ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          ignore-unfixed: true
          image-ref: heiss-ui:test
          severity: CRITICAL,HIGH
      - name: Log In to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: publish
        name: Publish Verified Image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Summarise Image
        if: steps.publish.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo 'Published image tags:'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo "Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
