name: Studio

on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: studio-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      browser-image: ${{ steps.browser-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          # Renovate requires Node 24 in addition to the application runtime.
          tools: actionlint node node@24 npm:renovate oxfmt
      - name: Check Release Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json")).version')"
      - name: Install Dependencies
        run: mise run setup
      - name: Resolve Browser Image
        id: browser-image
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "image=mcr.microsoft.com/playwright:v" + require("@playwright/test/package.json").version + "-noble\n")'
      - name: Run Checks
        run: mise run check:app
      - name: Build Frontend
        run: mise run build
      - name: Save Frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: dist
          retention-days: 1

  browser:
    name: Browser
    needs: check
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.check.outputs.browser-image }}
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: node
      - name: Install Dependencies
        run: mise run setup
      - name: Restore Frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist
      - name: Check Studio Interactions
        run: npm run test:browser
      - name: Save Browser Failure Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

  image:
    name: Image
    needs: [browser, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore Frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract Metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          labels: org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build Image For Verification
        uses: docker/build-push-action@v7
        with:
          build-args: STUDIO_PREBUILT=1
          cache-from: type=gha,scope=studio
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=studio,mode=max,ignore-error=true' || '' }}
          context: .
          load: true
          platforms: linux/amd64
          tags: studio:test
      - name: Smoke-Test Runtime
        run: |
          docker run --cap-drop=ALL --detach --init --name studio-smoke \
            --publish 127.0.0.1:8787:8787 --read-only --rm \
            --security-opt=no-new-privileges \
            --tmpfs /data:uid=1000,gid=1000,mode=0700 --tmpfs /tmp studio:test
          trap 'docker logs studio-smoke; docker rm --force studio-smoke' EXIT
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' studio-smoke)" = healthy ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Log In to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Verified Image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          build-args: STUDIO_PREBUILT=1
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}

  worker:
    name: Worker
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/worker.yaml

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: gh node
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/changelog.mjs notes "$GITHUB_REF_NAME" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --repo "$GITHUB_REPOSITORY" --title "Studio $GITHUB_REF_NAME" --verify-tag
