name: Container

on:
  workflow_call:
    outputs:
      image_digest:
        description: Verified container image digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: metadata
        name: Extract Metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log In to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: build
        name: Build Image For Verification
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          load: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
          platforms: linux/amd64
          provenance: mode=max
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          sbom: true
          tags: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && format('{0}:candidate-{1}-{2}-{3}', env.IMAGE_NAME, github.sha, github.run_id, github.run_attempt) || 'heiss-ui:test' }}
      - id: verification
        name: Select Verification Image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          image=heiss-ui:test
          if [ "$PUBLISH" = true ]; then
            image="$IMAGE_NAME@$BUILD_DIGEST"
            docker pull "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Smoke-Test Runtime
        env:
          VERIFICATION_IMAGE: ${{ steps.verification.outputs.image }}
        run: |
          docker run --cap-drop=ALL --detach --init --name heiss-smoke \
            --publish 127.0.0.1:8787:8787 --read-only --rm \
            --security-opt=no-new-privileges \
            --tmpfs /data:uid=1000,gid=1000,mode=0700 --tmpfs /tmp "$VERIFICATION_IMAGE"
          trap 'docker logs heiss-smoke; docker rm --force heiss-smoke' EXIT
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' heiss-smoke)" = healthy ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          ignore-unfixed: true
          image-ref: ${{ steps.verification.outputs.image }}
          severity: CRITICAL,HIGH
      - id: publish
        name: Publish Verified Image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE_NAME@$IMAGE_DIGEST"
      - name: Summarise Image
        if: steps.publish.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo 'Published image tags:'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo "Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
