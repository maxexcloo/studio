name: Studio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only pull requests cancel superseded runs: every main commit must publish and release its image.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: studio-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      browser-image: ${{ steps.browser-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          # Renovate requires Node 24 in addition to the application runtime.
          tools: actionlint node node@24 npm:renovate oxfmt
      - name: Install Dependencies
        run: mise run setup
      - name: Resolve Browser Image
        id: browser-image
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "image=mcr.microsoft.com/playwright:v" + require("@playwright/test/package.json").version + "-noble\n")'
      - name: Run Checks
        run: mise run check:app
      - name: Build Frontend
        run: mise run build
      - name: Save Frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: dist
          retention-days: 1

  # Pull requests run Check only; the browser suite and image build run on main, where they gate
  # publishing and the release.
  browser:
    name: Browser
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its failures; one failing shard doesn't hide the others'.
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    container:
      image: ${{ needs.check.outputs.browser-image }}
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: node
      - name: Install Dependencies
        run: mise run setup
      - name: Restore Frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist
      - name: Check Studio Interactions
        run: mise run test:browser -- --shard=${{ matrix.shard }}
      - name: Save Browser Failure Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  image:
    name: Image
    needs: [browser, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore Frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract Metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          labels: org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
      - name: Build Image For Verification
        uses: docker/build-push-action@v7
        with:
          build-args: |
            STUDIO_COMMIT=${{ github.sha }}
            STUDIO_PREBUILT=1
          cache-from: type=gha,scope=studio
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=studio,mode=max,ignore-error=true' || '' }}
          context: .
          load: true
          platforms: linux/amd64
          tags: studio:test
      - name: Smoke-Test Runtime
        run: |
          docker run --cap-drop=ALL --detach --init --name studio-smoke \
            --publish 127.0.0.1:8787:8787 --read-only --rm \
            --security-opt=no-new-privileges \
            --tmpfs /data:uid=1000,gid=1000,mode=0700 --tmpfs /tmp studio:test
          trap 'docker logs studio-smoke; docker rm --force studio-smoke' EXIT
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' studio-smoke)" = healthy ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Log In to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Verified Image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          build-args: |
            STUDIO_COMMIT=${{ github.sha }}
            STUDIO_PREBUILT=1
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}

  release:
    name: Release
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialises version numbering. A newer pending release replaces an older one, which it includes.
    concurrency:
      cancel-in-progress: false
      group: studio-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assign Version
        id: version
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          # Runs can finish out of order; never release a commit the latest release already includes.
          if [ -n "$latest" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then
            echo "::notice::$latest already includes $GITHUB_SHA."
            exit 0
          fi
          day="$(date -u +%Y.%-m.%-d)"
          echo "version=$day.$(($(git tag --list "v$day.*" | wc -l) + 1))" >> "$GITHUB_OUTPUT"
      - name: Log In to GHCR
        if: steps.version.outputs.version
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Tag Verified Images
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The worker image is published only by main commits that change it.
          worker_commit="$(git log -1 --first-parent --format=%H -- .dockerignore .github/workflows/worker.yaml LICENSE worker)"
          worker="$IMAGE_NAME-worker:sha-$worker_commit"
          # The Worker workflow starts alongside this run and can take longer.
          for _ in $(seq 1 100); do
            if docker buildx imagetools inspect "$worker" >/dev/null 2>&1; then break; fi
            sleep 30
          done
          docker buildx imagetools inspect "$worker" >/dev/null || { echo "::error::$worker is missing; run the Worker workflow on main, then rerun this job."; exit 1; }
          for image in "$IMAGE_NAME:sha-$GITHUB_SHA" "$worker"; do
            docker buildx imagetools create --tag "${image%%:*}:$VERSION" "$image"
          done
      - name: Publish Release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Studio v$VERSION"
