name: Worker

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/worker.yaml
      - LICENSE
      - NOTICE
      - worker/**
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/worker.yaml
      - LICENSE
      - NOTICE
      - worker/**
  workflow_dispatch:

permissions:
  contents: read

# Only pull requests cancel superseded runs: every main commit must publish its sha image, which
# Studio's release job tags latest and versioned when the worker changed since the last release.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: worker-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-worker
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  image:
    name: Worker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: python ruff shellcheck uv
      - name: Check Bridges & Entrypoint
        run: "mise run check:python ::: check:shell ::: test:python"
      # The ROCm image fills the runner's disk; drop toolchains and images this job never uses.
      - name: Free Runner Disk
        run: |
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/dotnet /usr/share/swift
          docker image prune --all --force
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long,enable={{is_default_branch}}
      - name: Build Worker For Verification
        uses: docker/build-push-action@v7
        with:
          # The GPU image's layers exceed the GHA cache, so main publishes them to a registry cache
          # tag that later runs and pull requests reuse.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          context: .
          file: worker/Dockerfile
          # The Dockerfile's last step checks the packaged runtime; loading the image into Docker
          # as well would need a third copy of it on the runner's disk.
          outputs: type=cacheonly
          platforms: linux/amd64
      - name: Log In to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Verified Worker
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true
          context: .
          file: worker/Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
