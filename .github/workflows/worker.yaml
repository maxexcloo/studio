name: Worker

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/worker.yaml
      - LICENSE
      - worker/**
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/worker.yaml
      - LICENSE
      - worker/**
  workflow_dispatch:

permissions:
  contents: read

# Only pull requests cancel superseded runs: every main commit must publish its sha image, which a
# release tag of that commit promotes.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: worker-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  image:
    name: Worker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: python ruff uv
      - name: Check Bridges & GPU Leases
        run: "mise run check:python ::: test:python"
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
      - name: Build Worker For Verification
        uses: docker/build-push-action@v7
        with:
          # Reuse this job's BuildKit cache for publication without exporting the GPU image to GHA.
          context: .
          file: worker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: studio-worker:test
      - name: Smoke-Test Packaged Runtime
        run: |
          docker run --rm --entrypoint /bin/bash studio-worker:test -ec '
            command -v flock
            test -x /opt/radiance/runtime/ld-linux-x86-64.so.2
            test -x /opt/radiance/bin/radiance
            test -s /opt/studio/LICENSE
            python3 -m compileall -q /root/ComfyUI/custom_nodes/radiance /root/ComfyUI/custom_nodes/studio_worker
            bash -n /opt/studio/entrypoint.sh
            sh -n /opt/studio/gpu-lease.sh
          '
      - name: Log In to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Verified Worker
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
