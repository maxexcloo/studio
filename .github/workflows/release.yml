name: Release

# `npm run release` bumps the version, dates CHANGELOG.md and tags vX.Y.Z;
# pushing that tag runs the checks, publishes the verified container image
# under the version's tags and creates a GitHub release whose notes are that
# version's changelog section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: gh node
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_IMAGE_DIGEST: ${{ needs.checks.outputs.image_digest }}
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY" --title "Studio ${GITHUB_REF_NAME}" --verify-tag
