name: Release

# `npm run release` bumps the version, dates CHANGELOG.md and tags vX.Y.Z;
# pushing that tag publishes a prebuilt download (the built app plus the
# server, no sources or build tools) with the changelog section as notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    secrets:
      HEISS_RELEASE_SIGNING_KEY: ${{ secrets.HEISS_RELEASE_SIGNING_KEY }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint gh node python updatecli
      - name: Install Dependencies
        run: mise run setup
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import { validateReleaseTag } from './scripts/release-plan.mjs'; import fs from 'node:fs'; validateReleaseTag(JSON.parse(fs.readFileSync('package.json')).version, process.env.GITHUB_REF)"
      # Signs the updater's zip with the release key (a .sig beside it) that installed
      # copies check before updating; see server/release-signing.js. A tag build
      # stops here if the app trusts a key and this secret is missing.
      - run: npm run package
        env:
          HEISS_RELEASE_SIGNING_KEY: ${{ secrets.HEISS_RELEASE_SIGNING_KEY }}
      - name: Stage & Publish Verified Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          HEISS_IMAGE_DIGEST: ${{ needs.checks.outputs.image_digest }}
        # The notes are that version's CHANGELOG.md section (scripts/release.mjs writes it).
        run: |
          shopt -s nullglob
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME}" > release-notes.md
          node scripts/release-provenance.mjs > release-provenance.json
          gh release create "${GITHUB_REF_NAME}" --draft --notes-file release-notes.md --repo "$GITHUB_REPOSITORY" --title "HEISS UI ${GITHUB_REF_NAME}" --verify-tag
          gh release upload "${GITHUB_REF_NAME}" release/*.zip release/*.zip.sha256 release/*.zip.sig release-provenance.json --repo "$GITHUB_REPOSITORY"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Keep the package as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: heiss-ui-release
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.zip.sig
