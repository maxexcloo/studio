name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

  workflow_call:
    outputs:
      image_digest:
        description: Verified container image digest
        value: ${{ jobs.container.outputs.image_digest }}

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ci-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node python updatecli
      - name: Check Release Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import { validateReleaseTag } from './scripts/release-plan.mjs'; import fs from 'node:fs'; validateReleaseTag(JSON.parse(fs.readFileSync('package.json')).version, process.env.GITHUB_REF)"
      - name: Install Dependencies
        run: mise run setup
      - name: Run Checks
        run: mise run check
      - name: Build Studio
        run: mise run build
      - name: Install Browser
        run: npx playwright install --with-deps chromium
      - name: Check Studio Interactions
        run: npm run test:browser
      - name: Save Browser Failure Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

  container:
    name: Container
    if: github.event_name != 'pull_request'
    needs: [build]
    uses: ./.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
