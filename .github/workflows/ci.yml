name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

  workflow_call:
    outputs:
      image_digest:
        description: Verified container image digest
        value: ${{ jobs.container.outputs.image_digest }}

permissions:
  contents: read

# A newer push supersedes an older run; release tags always finish.
concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: ci-${{ github.ref }}

jobs:
  build:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node node@24 npm:renovate python uv
      - if: startsWith(github.ref, 'refs/tags/')
        name: Check Release Tag
        run: node --input-type=module -e "import { validateReleaseTag } from './scripts/release-plan.mjs'; import fs from 'node:fs'; validateReleaseTag(JSON.parse(fs.readFileSync('package.json')).version, process.env.GITHUB_REF)"
      - name: Install Dependencies
        run: mise run setup
      - name: Run Checks
        run: mise run check

  browser:
    name: Browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: node
      - name: Install Dependencies
        run: mise run setup
      - name: Build Studio
        run: mise run build
      - name: Install Browser
        run: npx playwright install --with-deps chromium webkit
      - name: Check Studio Interactions
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - if: failure()
        name: Save Browser Failure Traces
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Builds, smoke-tests and scans the image once every check passes, then publishes it.
  container:
    if: github.event_name != 'pull_request'
    name: Container
    needs: [browser, build]
    uses: ./.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write
