name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

  workflow_call:
    outputs:
      image_digest:
        description: Verified container image digest
        value: ${{ jobs.container.outputs.image_digest }}

permissions:
  contents: read

# A newer push supersedes an older run; release tags always finish.
concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: ci-${{ github.ref }}

jobs:
  build:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node node@24 npm:renovate python
      - name: Check Release Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import { validateReleaseTag } from './scripts/release-plan.mjs'; import fs from 'node:fs'; validateReleaseTag(JSON.parse(fs.readFileSync('package.json')).version, process.env.GITHUB_REF)"
      - name: Install Dependencies
        run: mise run setup
      - name: Run Checks
        run: mise run check

  browser:
    name: Browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: node
      - name: Install Dependencies
        run: mise run setup
      - name: Build Studio
        run: mise run build
      - name: Install Browser
        run: npx playwright install --with-deps chromium
      - name: Check Studio Interactions
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - name: Save Browser Failure Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Builds, smoke-tests and scans a candidate image alongside the checks; publishing waits for all of them.
  container:
    name: Container
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/container.yaml
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish Image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [browser, build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Verified Image
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAGS: ${{ needs.container.outputs.image_tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE_NAME@$IMAGE_DIGEST"
          {
            echo 'Published image tags:'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo "Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
