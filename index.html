<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Added to a phone's home screen, it opens full-screen like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <title>Studio</title>
    <!-- Ask for what the first screen needs while the app's code downloads (src/app/api.ts takes each answer once). -->
    <script>
      (function () {
        var boot = window.__studioBoot = {};
        ['/api/accounts/status', '/api/access/status', '/api/models', '/api/comfy/status'].forEach(function (url) {
          try { boot[url] = { at: Date.now(), response: fetch(url, { cache: 'no-store', credentials: 'same-origin', headers: { 'X-Studio': '1' } }) }; } catch (error) { /* The app asks again. */ }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
