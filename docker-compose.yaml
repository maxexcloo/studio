name: studio

services:
  studio:
    build: .
    image: studio:development
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      STUDIO_CONFIG_DIR: /config
      STUDIO_DOCKER_HOST_ONLY: "1"
      STUDIO_OUTPUT_STORAGE: studio
      STUDIO_RUNTIME_AUTOMATIC: "0"
      STUDIO_WORKERS: ${STUDIO_WORKERS:?Set STUDIO_WORKERS to the configured worker JSON list}
    volumes:
      - studio-data:/data
      - "${STUDIO_CONFIG_HOST:?Set STUDIO_CONFIG_HOST to the ai configuration checkout}:/config:ro"

volumes:
  studio-data:
