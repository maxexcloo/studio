# Studio in a container: the studio talks to browsers, ComfyUI keeps running
# where the GPU is and is reached over the network.
#
# Before the first start, put ComfyUI's output folder in a .env file next to
# this one (compose reads it for every command, so up, logs and down all work):
#
#   COMFY_OUTPUT_HOST=/path/to/ComfyUI/output
#
# then: docker compose up --build
#
# The studio answers at http://localhost:8787 on this computer, same as a plain
# install. The app's own settings are made in Settings and kept on the data
# volume; this .env only feeds the two names below.

name: studio

services:
  studio:
    build: .
    image: studio:latest
    container_name: studio
    restart: unless-stopped
    ports:
      # This computer only. Docker hands the container the browser's requests
      # from an address of its own, so HEISS_DOCKER_HOST_ONLY tells the studio
      # they all come from this computer, which is only true with 127.0.0.1 here.
      - "127.0.0.1:8787:8787"
    environment:
      HEISS_DOCKER_HOST_ONLY: "1"
      # Where to look for ComfyUI until Settings › Connection saves an address.
      # host.docker.internal names the machine Docker runs on (extra_hosts below
      # adds that name on plain Linux; Docker Desktop has it already).
      # ComfyUI must be listening beyond 127.0.0.1 (--listen) to accept this.
      HEISS_DEFAULT_COMFY_URL: ${HEISS_DOCKER_COMFY_URL:-http://host.docker.internal:8188}
      # Studio reads the images ComfyUI writes straight from ComfyUI's output
      # folder, so that folder is mounted into the container at a path of our
      # own and set as the output folder.
      COMFY_OUTPUT_DIR: /comfy-output
    volumes:
      # Gallery, vault, downloads and saved settings, kept across rebuilds.
      - studio-data:/data
      # ComfyUI's output folder on the machine it runs on. Compose stops with a
      # clear message rather than start without it (see the header above).
      - "${COMFY_OUTPUT_HOST:?put COMFY_OUTPUT_HOST=/path/to/ComfyUI/output in a .env file next to docker-compose.yml}:/comfy-output"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  studio-data:
