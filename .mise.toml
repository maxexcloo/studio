[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = ["check:actions", "check:mise", "check:updates"]
run = [{ task = "check:typescript" }, { task = "test" }]

[tasks.dev]
run = "npm run dev"

[tasks.test]
run = "npm test"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"

# Native MCP
[tasks."test:mcp"]
run = "node --test server/mcp*.test.js"

# Studio Import (a dry run unless --apply; see docs/guides/CONFIGURATION.md)
[tasks."import:studio"]
run = "node scripts/import-studio.mjs"

# Release Preparation
[tasks."release:prepare"]
run = "npm run release -- minor --dry-run"
