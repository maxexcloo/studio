[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = ["check:app", "check:python", "check:shell", "test:python"]

[tasks."check:app"]
depends = [
  "check:actions",
  "check:apostrophes",
  "check:mise",
  "check:oxfmt",
  "check:oxlint",
  "check:typescript",
  "check:updates",
  "check:whitespace",
  "test",
]

# Copy uses straight apostrophes.
[tasks."check:apostrophes"]
run = "! git grep -n '’' -- backend frontend/src"

[tasks."check:oxlint"]
run = "oxlint --deny-warnings"

[tasks.dev]
run = "node dev.mjs"

[tasks."dev:demo"]
run = "node dev.mjs --demo"

[tasks.test]
run = "node --test 'backend/**/*.test.{js,ts}' 'frontend/**/*.test.ts'"

[tasks."test:browser"]
run = "playwright test"

# Native bridge checks live with each custom node, outside tests/.
[tasks."test:python"]
run = '''
PYTHONPATH=worker/comfyui python -B -m unittest discover -s worker/comfyui/radiance -p 'test_*.py'
PYTHONPATH=worker/comfyui python -B -m unittest discover -s worker/comfyui/studio_worker -p 'test_*.py'
'''

# Scripts
# Signs agent-browser in to live Studio and LibreChat as the Git user, through kubectl exec.
[tasks."browser-sign-in"]
run = "node backend/commands/browser-sign-in.mjs"

# Replays the prompt assistant evals through live Bifrost on demand, never in CI; --record refreshes the fixtures.
[tasks."eval:assistant"]
run = "node backend/commands/assistant-eval.mjs"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"
