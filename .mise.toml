[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:typescript",
  "check:updates",
  "check:whitespace",
  "test",
  "test:python",
]

[tasks.dev]
run = "npm run dev"

[tasks.test]
run = "npm test"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"

# Native MCP
[tasks."test:mcp"]
run = "node --test server/mcp*.test.js"

# Prompt Assistant Evals (live LiteLLM replay on demand, never in CI; --record refreshes the fixtures)
[tasks."eval:assistant"]
run = "node scripts/assistant-eval.mjs"

# Studio Import (a dry run unless --apply; see docs/guides/CONFIGURATION.md)
[tasks."import:studio"]
run = "node scripts/import-studio.mjs"

# Native bridge checks live with each custom node, outside tests/.
[tasks."test:python"]
run = """
PYTHONPATH=comfyui uv run --no-project --with pillow python -B -m unittest discover -s comfyui/cliproxy -p 'test_*.py'
PYTHONPATH=comfyui python -B -m unittest discover -s comfyui/radiance -p 'test_*.py'
PYTHONPATH=comfyui python -B -m unittest discover -s comfyui/studio_worker -p 'test_*.py'
python -B -m unittest discover -s worker -p 'test_*.py'
"""

# Offline runtime migration is a dry run unless --apply is supplied.
[tasks."migrate:runtime"]
run = "node scripts/migrate-runtime.mjs"
