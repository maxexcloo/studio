[vars]
actionlint_args = '-shellcheck=""'

[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = ["check:actions", "check:mise", "check:updates"]
run = [{ task = "check:typescript" }, { task = "test" }]

[tasks.dev]
run = "npm run dev"

[tasks.test]
run = "npm test"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"
