[tools]
# gh = "latest"
# node = "latest"
# updatecli = "latest"
actionlint = "1.7.12"

[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = """
tsc -b
vite build
"""

[tasks.check]
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
mise fmt --check
actionlint -shellcheck=""
tsc --noEmit
node --test server/*.test.js scripts/*.test.js
"""

[tasks.dev]
run = """
node scripts/ensure-runtime-dependencies.mjs --dev
node scripts/dev.mjs
"""

[tasks.test]
run = "node --test server/*.test.js scripts/*.test.js"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"
