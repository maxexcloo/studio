[vars]
actionlint_args = '-shellcheck=""'
node_install_args = "--no-audit --no-fund"

[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
depends = ["build:node"]

[tasks.check]
depends = ["check:actions", "check:mise", "check:updates"]
run = [{ task = "check:typescript" }, { task = "test:node" }]

[tasks.dev]
depends = ["dev:node"]

[tasks.test]
depends = ["test:node"]

# Setup
[tasks.setup]
depends = ["setup:node"]
