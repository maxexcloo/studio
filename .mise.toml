[tools]
# gh = "latest"
# node = "latest"
# updatecli = "latest"
actionlint = "1.7.12"

[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
mise fmt --check
actionlint -shellcheck=""
tsc --noEmit
npm test
"""

[tasks.dev]
run = "npm run dev"

[tasks.test]
run = "npm test"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"
