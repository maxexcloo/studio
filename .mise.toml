[env]
_.path = ["node_modules/.bin"]

# Development
[tasks.build]
run = "npm run build"

[tasks.check]
depends = ["check:app", "check:python", "test:python"]

[tasks."check:app"]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:typescript",
  "check:updates",
  "check:whitespace",
  "test",
]

[tasks.dev]
run = "npm run dev"

[tasks.test]
run = "npm test"

[tasks."test:browser"]
run = "playwright test"

# Setup
[tasks.setup]
run = "npm ci --no-audit --no-fund"

# Prompt Assistant Evals (live LiteLLM replay on demand, never in CI; --record refreshes the fixtures)
[tasks."eval:assistant"]
run = "node backend/commands/assistant-eval.mjs"

# Studio Import (a dry run unless --apply; see CONFIGURATION.md)
[tasks."import:studio"]
run = "node backend/commands/import-studio.mjs"

# Native bridge checks live with each custom node, outside tests/.
[tasks."test:python"]
run = """
PYTHONPATH=worker/comfyui python -B -m unittest discover -s worker/comfyui/radiance -p 'test_*.py'
PYTHONPATH=worker/comfyui python -B -m unittest discover -s worker/comfyui/studio_worker -p 'test_*.py'
"""

# Offline runtime migration is a dry run unless --apply is supplied.
[tasks."migrate:runtime"]
run = "node backend/commands/migrate-runtime.mjs"
